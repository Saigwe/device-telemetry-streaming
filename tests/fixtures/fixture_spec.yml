# Synthetic fixture for CI. Same table and column names as the real-data load.
# pk / fk / cast describe the tables for staging and tests; the generator ignores them.
seed: 707
tables:
  - name: devices
    rows: 200
    pk: device_id
    columns:
      device_id: {type: id, prefix: D}
      site_id: {type: choice, values: [S001, S002, S003, S004, S005, S006, S007, S008, S009, S010]}
  - name: heartbeats
    rows: 20000
    fk: {device_id: devices.device_id}
    dedupe: {key: event_id, order_by: ingested_ts}
    columns:
      event_id: {type: id, prefix: EV, width: 8}
      device_id: {type: fk, table: devices, column: device_id}
      event_ts: {type: timestamp, start: "2025-03-01 00:00:00", end: "2025-03-01 06:00:00"}
      status: {type: choice, values: [ok, degraded, failed], p: [0.97, 0.025, 0.005]}
      battery_pct: {type: int, low: 5, high: 100}
      ingested_ts: {type: expr, expr: "df.event_ts + pd.to_timedelta(np.where(rng.random(n) < 0.02, rng.integers(180, 900, n), rng.integers(1, 20, n)), unit='s')"}
    duplicate: {rows: 300, shift_column: ingested_ts, shift_minutes: 1}
