# Local Kafka for the streaming path (same image and flags as CI). Start with: docker compose up -d
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.18
    command: [redpanda, start, --mode, dev-container, --smp, "1",
              --kafka-addr, "internal://0.0.0.0:9092", --advertise-kafka-addr, "internal://localhost:9092",
              --schema-registry-addr, "internal://0.0.0.0:8081"]
    ports: ["9092:9092", "8081:8081"]
